<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE ATLAS 擎海 — 位置概覽</title>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="location">

<section class="page-hero">
  <p class="sub" data-i18n="location.sub"></p>
  <h1 data-i18n="location.title"></h1>
</section>

<!-- 航拍主視覺 -->
<section class="section tp-section tp-section--tight">
  <figure class="tp-figure fade-up tp-figure--wide">
    <img src="assets/img/drone.webp" alt="THE ATLAS" loading="lazy">
  </figure>
  <p class="small-print fade-up" data-i18n="location.heroNote"></p>
</section>

<!-- 一、躍進維港 -->
<section class="section tp-section">
  <p class="kicker fade-up" data-i18n="location.coast.kicker"></p>
  <h2 class="tp-title fade-up" data-i18n="location.coast.title"></h2>
  <div class="tp-body">
    <p class="lead fade-up" data-i18n="location.coast.body.0"></p>
    <p class="lead fade-up" data-i18n="location.coast.body.1"></p>
    <p class="lead fade-up" data-i18n="location.coast.body.2"></p>
  </div>
</section>

<!-- 二、縱橫天下 -->
<section class="section tp-section tp-section--alt">
  <p class="kicker fade-up" data-i18n="location.transit.kicker"></p>
  <h2 class="tp-title fade-up" data-i18n="location.transit.title"></h2>
  <div class="tp-body">
    <p class="lead fade-up" data-i18n="location.transit.body.0"></p>
    <p class="lead fade-up" data-i18n="location.transit.body.1"></p>
    <p class="lead fade-up" data-i18n="location.transit.body.2"></p>
  </div>

  <div class="stat-row" data-i18n-list="location.transit.stats" data-tpl="stat"></div>

  <figure class="tp-figure fade-up">
    <img src="assets/img/transportation.webp" alt="MTR" loading="lazy">
    <figcaption data-i18n="location.transit.mtrTitle"></figcaption>
  </figure>

  <figure class="tp-figure fade-up">
    <img src="assets/img/location-map.webp" alt="Location Map" loading="lazy">
    <figcaption data-i18n="location.transit.mapTitle"></figcaption>
  </figure>
</section>

<!-- 三、卓然啟航 -->
<section class="section tp-section">
  <p class="kicker fade-up" data-i18n="location.sail.kicker"></p>
  <h2 class="tp-title fade-up" data-i18n="location.sail.title"></h2>
  <div class="tp-body">
    <p class="lead fade-up" data-i18n="location.sail.body.0"></p>
    <p class="lead fade-up" data-i18n="location.sail.body.1"></p>
  </div>

  <div class="photo-grid" data-i18n-list="location.sail.photos" data-tpl="photocap"></div>
  <p class="small-print fade-up" data-i18n="location.sail.photosNote"></p>
</section>

<!-- 四、翱翔海岸 -->
<section class="section tp-section tp-section--alt">
  <p class="kicker fade-up" data-i18n="location.soar.kicker"></p>
  <h2 class="tp-title fade-up" data-i18n="location.soar.title"></h2>
  <div class="tp-body">
    <p class="lead fade-up" data-i18n="location.soar.body.0"></p>
    <p class="lead fade-up" data-i18n="location.soar.body.1"></p>
  </div>
</section>

<!-- 五、購物休閒 -->
<section class="section tp-section">
  <p class="kicker fade-up" data-i18n="location.shop.kicker"></p>
  <h2 class="tp-title fade-up" data-i18n="location.shop.title"></h2>
  <div class="tp-body">
    <p class="lead fade-up" data-i18n="location.shop.body.0"></p>
    <p class="lead fade-up" data-i18n="location.shop.body.1"></p>
  </div>
</section>

<!-- 附註 -->
<section class="section tp-section tp-section--tight">
  <details class="notes fade-up">
    <summary data-i18n="location.notesTitle"></summary>
    <ol class="notes-list" data-notes-list="location"></ol>
  </details>
</section>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/i18n-notes.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
