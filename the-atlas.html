<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE ATLAS 擎海 — THE ATLAS</title>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="atlas">

<section class="page-hero">
  <p class="sub" data-i18n="atlas.sub"></p>
  <h1 data-i18n="atlas.title"></h1>
</section>

<!-- 一、奢雅會所 -->
<section class="section tp-section">
  <p class="kicker fade-up" data-i18n="atlas.club.kicker"></p>
  <h2 class="tp-title fade-up" data-i18n="atlas.club.title"></h2>
  <div class="tp-body">
    <p class="lead fade-up" data-i18n="atlas.club.body.0"></p>
    <p class="lead fade-up" data-i18n="atlas.club.body.1"></p>
    <p class="lead fade-up" data-i18n="atlas.club.body.2"></p>
  </div>

  <div class="facilities-grid" data-i18n-list="atlas.facilities" data-tpl="facility"></div>
  <p class="small-print fade-up" data-i18n="atlas.facilitiesNote"></p>
</section>

<!-- 二、匠心建築設計 -->
<section class="section tp-section tp-section--alt">
  <p class="kicker fade-up" data-i18n="atlas.arch.kicker"></p>
  <h2 class="tp-title fade-up" data-i18n="atlas.arch.title"></h2>
  <div class="tp-body">
    <p class="lead fade-up" data-i18n="atlas.arch.body.0"></p>
    <p class="lead fade-up" data-i18n="atlas.arch.body.1"></p>
  </div>
  <p class="tp-teams fade-up" data-i18n="atlas.arch.teams"></p>

  <figure class="tp-figure fade-up">
    <img src="assets/img/facilities/entrance.webp" alt="THE ATLAS" loading="lazy">
    <figcaption data-i18n="atlas.arch.imgCaption"></figcaption>
  </figure>
</section>

<!-- 三、國際頂級廚衛家電 -->
<section class="section tp-section">
  <p class="kicker fade-up" data-i18n="atlas.fittings.kicker"></p>
  <h2 class="tp-title fade-up" data-i18n="atlas.fittings.title"></h2>
  <div class="tp-body">
    <p class="lead fade-up" data-i18n="atlas.fittings.body.0"></p>
    <p class="lead fade-up" data-i18n="atlas.fittings.body.1"></p>
  </div>

  <div class="brand-row" data-i18n-list="atlas.brands" data-tpl="brand"></div>
</section>

<!-- 四、項目資料 -->
<section class="section tp-section tp-section--alt">
  <h2 class="tp-title fade-up" data-i18n="atlas.factsTitle"></h2>
  <table class="facts">
    <tbody data-i18n-list="atlas.facts" data-tpl="facts"></tbody>
  </table>
  <p class="small-print fade-up" data-i18n="atlas.disclaimer"></p>
</section>

<!-- 附註 -->
<section class="section tp-section tp-section--tight">
  <details class="notes fade-up">
    <summary data-i18n="atlas.notesTitle"></summary>
    <ol class="notes-list" data-notes-list="atlas"></ol>
  </details>
</section>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/i18n-notes.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
