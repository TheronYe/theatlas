<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
const f = document.createElement('iframe');
f.style.cssText = 'width:390px;height:844px;border:0';
f.src = '../index.html';
f.onload = () => setTimeout(() => {
  const d = f.contentDocument, w = f.contentWindow;
  const gate = d.querySelector('.splash-gate');
  if (gate && !gate.classList.contains('hidden')) gate.querySelector('[data-gate-enter]').click();
  setTimeout(() => {
    const card = d.querySelector('.card');
    const r = {};
    card.scrollIntoView({ block: 'center' });
    setTimeout(() => {
      r.afterScrollIn = { in: card.classList.contains('in'), top: Math.round(card.getBoundingClientRect().top), scrollY: Math.round(w.scrollY) };
      w.scrollTo(0, 0);
      setTimeout(() => {
        r.afterScrollOut = { in: card.classList.contains('in'), top: Math.round(card.getBoundingClientRect().top), scrollY: Math.round(w.scrollY) };
        // 再滚回来 → 应重新播放
        card.scrollIntoView({ block: 'center' });
        setTimeout(() => {
          r.afterScrollBack = { in: card.classList.contains('in'), top: Math.round(card.getBoundingClientRect().top) };
          r.loopOK = r.afterScrollIn.in === true && r.afterScrollOut.in === false && r.afterScrollBack.in === true;
          document.getElementById('out').textContent = JSON.stringify(r, null, 1);
        }, 1000);
      }, 1000);
    }, 1000);
  }, 800);
}, 1500);
document.body.appendChild(f);
</script>
</body></html>
