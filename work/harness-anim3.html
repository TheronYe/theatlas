<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
const f = document.createElement('iframe');
f.style.cssText = 'width:390px;height:844px;border:0';
f.src = '../index.html';
f.onload = () => setTimeout(() => {
  const d = f.contentDocument, w = f.contentWindow;
  const log = [];
  const gate = d.querySelector('.splash-gate');
  if (gate && !gate.classList.contains('hidden')) gate.querySelector('[data-gate-enter]').click();

  function poll(fn, label, cb) {
    let n = 0;
    const t = setInterval(() => {
      n++;
      if (fn() || n > 25) { clearInterval(t); log.push(label + '=' + fn() + '(polls=' + n + ')'); cb(); }
    }, 200);
  }

  setTimeout(() => {
    const card = d.querySelector('.card');
    log.push('io=' + (typeof w.IntersectionObserver !== 'undefined'));
    log.push('fadeUpCount=' + d.querySelectorAll('.fade-up').length);
    card.scrollIntoView({ block: 'center' });
    poll(() => card.classList.contains('in'), 'visible', () => {
      w.scrollTo(0, 0);
      poll(() => !card.classList.contains('in'), 'hidden', () => {
        card.scrollIntoView({ block: 'center' });
        poll(() => card.classList.contains('in'), 'replay', () => {
          document.getElementById('out').textContent = log.join('\n');
        });
      });
    });
  }, 1200);
}, 1500);
document.body.appendChild(f);
</script>
</body></html>
