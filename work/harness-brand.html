<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
window.onerror = function (m) { document.getElementById('out').textContent = 'JS ERROR: ' + m; };
try { sessionStorage.setItem('atlas-legal-accepted', '1'); } catch (e) { document.getElementById('out').textContent = 'SS ERR: ' + e.message; }
const f = document.createElement('iframe');
f.style.cssText = 'width:390px;height:844px;border:0';
f.src = '../the-atlas.html';
f.onload = () => setTimeout(() => {
  const d = f.contentDocument;
  const cw = d.documentElement.clientWidth;
  const row = d.querySelector('.brand-row');
  const rr = row.getBoundingClientRect();
  const lines = [...d.querySelectorAll('.brand')].map(b => {
    const r = b.getBoundingClientRect();
    const lab = b.querySelector('.brand-label');
    const lr = lab.getBoundingClientRect();
    return 'brand x=' + Math.round(r.left) + ' w=' + Math.round(r.width) + ' | label x=' + Math.round(lr.left) + ' w=' + Math.round(lr.width) + ' right=' + Math.round(lr.right) + ' | "' + lab.textContent.slice(0, 18) + '"';
  });
  const sw = Math.max(d.documentElement.scrollWidth, d.body.scrollWidth);
  document.getElementById('out').textContent =
    'cw=' + cw + ' sw=' + sw + '\nrow: x=' + Math.round(rr.left) + ' w=' + Math.round(rr.width) + ' scrollW=' + row.scrollWidth + '\n' + lines.join('\n');
}, 3000);
document.body.appendChild(f);
</script>
</body></html>
