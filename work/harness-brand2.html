<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
try { sessionStorage.setItem('atlas-legal-accepted', '1'); } catch (e) {}
const f = document.createElement('iframe');
f.style.cssText = 'width:390px;height:844px;border:0';
f.src = '../the-atlas.html';
f.onload = () => setTimeout(() => {
  try {
    const d = f.contentDocument, w = f.contentWindow;
    w.onerror = function (m) { document.getElementById('out').textContent = 'CHILD JS ERROR: ' + m; };
    const info = {
      readyState: d.readyState,
      cw: d.documentElement.clientWidth,
      sw: Math.max(d.documentElement.scrollWidth, d.body.scrollWidth)
    };
    const row = d.querySelector('.brand-row');
    const rr = row.getBoundingClientRect();
    info.row = { x: Math.round(rr.left), w: Math.round(rr.width), scrollW: row.scrollWidth };
    info.items = [...d.querySelectorAll('.brand-row .brand')].map(b => {
      const r = b.getBoundingClientRect();
      const lab = b.querySelector('.brand-label');
      const lr = lab.getBoundingClientRect();
      return { x: Math.round(r.left), w: Math.round(r.width), labRight: Math.round(lr.right), labW: Math.round(lr.width), t: lab.textContent.slice(0, 14) };
    });
    // 找出溢出元素
    const cw = info.cw;
    info.overflows = [...d.querySelectorAll('.tp-section *')].filter(el => {
      const r = el.getBoundingClientRect();
      return r.right > cw + 1;
    }).slice(0, 8).map(el => el.tagName + '.' + (el.className.split ? el.className.split(' ')[0] : '') + '@r=' + Math.round(el.getBoundingClientRect().right));
    document.getElementById('out').textContent = JSON.stringify(info, null, 1);
  } catch (e) {
    document.getElementById('out').textContent = 'HARNESS ERR: ' + e.message;
  }
}, 3000);
document.body.appendChild(f);
</script>
</body></html>
