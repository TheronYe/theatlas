<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
const f = document.createElement('iframe');
f.style.cssText = 'width:390px;height:844px;border:0';
f.src = '../index.html';
f.onload = () => setTimeout(() => {
  const d = f.contentDocument, w = f.contentWindow;
  const gate = d.querySelector('.splash-gate');
  if (gate && !gate.classList.contains('hidden')) gate.querySelector('[data-gate-enter]').click();
  setTimeout(() => {
    const r = {};
    const cue = d.querySelector('.scroll-cue');
    r.cue = !!cue;
    if (cue) {
      const cr = cue.getBoundingClientRect();
      r.cueRect = { top: Math.round(cr.top), bottom: Math.round(cr.bottom), left: Math.round(cr.left), right: Math.round(cr.right) };
      r.cueCentered = Math.abs((cr.left + cr.right) / 2 - 195) < 6;
      r.cueInViewport = cr.top >= 0 && cr.bottom <= 844;
      const dis = d.querySelector('.hero-disclaimer').getBoundingClientRect();
      r.aboveDisclaimer = cr.bottom <= dis.top;
      r.label = cue.querySelector('.scroll-cue-label').textContent;
      const svg = cue.querySelector('svg');
      r.svgAnim = w.getComputedStyle(svg).animationName;
      r.scrollYBefore = Math.round(w.scrollY);
      cue.click();
      setTimeout(() => {
        r.scrollYAfter = Math.round(w.scrollY);
        r.scrolledDown = w.scrollY > 400;
        r.noHscroll = d.documentElement.scrollWidth <= d.documentElement.clientWidth + 1;
        document.getElementById('out').textContent = JSON.stringify(r, null, 1);
      }, 1300);
    } else {
      document.getElementById('out').textContent = 'no cue';
    }
  }, 900);
}, 1500);
document.body.appendChild(f);
</script>
</body></html>
