<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
const f = document.createElement('iframe');
f.style.cssText = 'width:390px;height:844px;border:0';
f.src = '../index.html';
f.onload = () => setTimeout(() => {
  const d = f.contentDocument, w = f.contentWindow;
  const r = {};
  r.header = !!d.querySelector('.site-header');
  r.floatContact = !!d.querySelector('.float-contact');
  r.legalModal = !!d.querySelector('.legal-modal');
  r.gate = !!d.querySelector('.splash-gate');
  r.koi = !!d.querySelector('.hero-koi');
  r.reducedMotion = w.matchMedia('(prefers-reduced-motion: no-preference)').matches;
  const els = [...d.querySelectorAll('.fade-up')];
  r.total = els.length;
  r.withIn = els.filter(e => e.classList.contains('in')).length;
  r.classes = els.slice(0, 6).map(e => e.className + '@op=' + w.getComputedStyle(e).opacity);
  document.getElementById('out').textContent = JSON.stringify(r, null, 1);
}, 3000);
document.body.appendChild(f);
</script>
</body></html>
