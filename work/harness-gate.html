<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
const f = document.createElement('iframe');
f.style.cssText = 'width:390px;height:844px;border:0';
f.src = '../index.html';
f.onload = () => setTimeout(() => {
  const d = f.contentDocument, w = f.contentWindow;
  const gate = d.querySelector('.splash-gate');
  const scroll = gate.querySelector('.splash-gate__scroll');
  const panel = gate.querySelector('.splash-gate__panel');
  const btn = gate.querySelector('[data-gate-enter]');
  const r = { before: {}, after: {} };
  r.paras = scroll.querySelectorAll('p').length;
  r.overflowY = w.getComputedStyle(scroll).overflowY;
  r.sh = scroll.scrollHeight; r.ch = scroll.clientHeight;
  r.btnRect = JSON.stringify(btn.getBoundingClientRect().toJSON());
  r.panelH = panel.getBoundingClientRect().height;
  r.viewportH = f.clientHeight;
  // 尝试滚动
  scroll.scrollTop = 80;
  r.scrollTopAfter = scroll.scrollTop;
  // 点击进入 → gate 应隐藏，视频开始播放
  btn.click();
  setTimeout(() => {
    const v = d.querySelector('.hero-koi');
    r.gateHidden = gate.classList.contains('hidden');
    r.gateDisplay = w.getComputedStyle(gate).display;
    r.videoPaused = v ? v.paused : 'n/a';
    r.videoLoop = v ? v.loop : 'n/a';
    r.videoTime = v ? v.currentTime.toFixed(2) : 'n/a';
    r.bodyOverflow = w.getComputedStyle(d.body).overflow;
    document.getElementById('out').textContent = JSON.stringify(r, null, 1);
  }, 1500);
}, 1200);
document.body.appendChild(f);
</script>
</body></html>
