<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
const langs = ['zh-hk','zh-cn','en'];
const out = [];
let pending = langs.length;
langs.forEach((L, idx) => {
  const f = document.createElement('iframe');
  f.style.cssText = 'width:390px;height:844px;border:0';
  f.src = '../privacy.html';
  f.onload = () => setTimeout(() => {
    try {
      const d = f.contentDocument, w = f.contentWindow, T = w.I18N[L];
      const modal = d.querySelector('.legal-modal');
      modal.classList.add('open');
      const body = modal.querySelector('.legal-modal__body');
      const sh = body.scrollHeight, ch = body.clientHeight;
      body.scrollTop = 60;
      out[idx] = `${L}: title="${T.legal.title}" paras=${T.legal.paragraphs.length} p1len=${T.legal.paragraphs[0].length} p2len=${T.legal.paragraphs[1].length} env=${T.media.envPhotos.length} transport="${T.location.transportTitle}" hotline=${T.footer.hotlineDisplay} modalParas=${modal.querySelectorAll('p').length} scrollTop=${body.scrollTop} sh=${sh} ch=${ch} overflowY=${d.defaultView.getComputedStyle(body).overflowY}`;
    } catch (e) { out[idx] = `${L}: ERROR ${e.message}`; }
    if (--pending === 0) document.getElementById('out').textContent = out.join('\n');
  }, 800);
  document.body.appendChild(f);
});
</script>
</body></html>
