<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
const out = [];
let pending = 2;

/* 1) index: gate 布局 + 入场动画类 + 滚动区约束 */
const f1 = document.createElement('iframe');
f1.style.cssText = 'width:390px;height:844px;border:0';
f1.src = '../index.html?g=' + Date.now(); // 每次新会话
f1.onload = () => setTimeout(() => {
  try {
    const d = f1.contentDocument, w = f1.contentWindow, cs = w.getComputedStyle;
    const gate = d.querySelector('.splash-gate');
    const panel = gate.querySelector('.splash-gate__panel');
    const scroll = gate.querySelector('.splash-gate__scroll');
    const btn = gate.querySelector('[data-gate-enter]');
    const r = {};
    r.visible = !gate.classList.contains('hidden');
    r.inClass = gate.classList.contains('in');          // 入场动画类
    r.panelRect = JSON.stringify({ top: Math.round(panel.getBoundingClientRect().top), bottom: Math.round(panel.getBoundingClientRect().bottom), h: Math.round(panel.getBoundingClientRect().height) });
    r.panelMaxH = cs(panel).maxHeight;
    r.panelOverflow = cs(panel).overflow;
    r.scrollOverflowY = cs(scroll).overflowY;
    r.scrollSH = scroll.scrollHeight; r.scrollCH = scroll.clientHeight;
    r.scrollCanScroll = scroll.scrollHeight > scroll.clientHeight;
    scroll.scrollTop = 60;
    r.scrollTopWorks = scroll.scrollTop > 0;
    const br = btn.getBoundingClientRect();
    r.btnInViewport = br.bottom <= 844 && br.top >= 0;
    r.panelFits = panel.getBoundingClientRect().bottom <= 844 + 1 && panel.getBoundingClientRect().top >= -1;
    out[0] = 'GATE: ' + JSON.stringify(r);
  } catch (e) { out[0] = 'GATE ERR ' + e.message; }
  if (--pending === 0) finish();
}, 1200);
document.body.appendChild(f1);

/* 2) privacy: 法律弹窗打开动画类 + 关闭流程 */
const f2 = document.createElement('iframe');
f2.style.cssText = 'width:390px;height:844px;border:0;position:absolute;left:450px;top:0';
f2.src = '../privacy.html';
f2.onload = () => setTimeout(() => {
  try {
    const d = f2.contentDocument;
    const modal = d.querySelector('.legal-modal');
    const r = {};
    d.querySelector('[data-legal-open]').click();
    r.open = modal.classList.contains('open');
    setTimeout(() => {
      r.inAfterOpen = modal.classList.contains('in');
      const panel = d.querySelector('.legal-modal__panel');
      const pr = panel.getBoundingClientRect();
      r.panelFits = pr.bottom <= 845 && pr.top >= -1;
      const body = d.querySelector('.legal-modal__body');
      r.bodyScroll = body.scrollHeight > body.clientHeight;
      body.scrollTop = 80;
      r.bodyScrollTop = body.scrollTop;
      d.querySelector('[data-legal-close]').click();
      r.inRemovedOnClose = !modal.classList.contains('in');
      r.leavingOnClose = modal.classList.contains('leaving');
      setTimeout(() => {
        r.closedAfterAnim = !modal.classList.contains('open');
        out[1] = 'MODAL: ' + JSON.stringify(r);
        if (--pending === 0) finish();
      }, 500);
    }, 200);
  } catch (e) { out[1] = 'MODAL ERR ' + e.message; if (--pending === 0) finish(); }
}, 1500);
document.body.appendChild(f2);

function finish() { document.getElementById('out').textContent = out.join('\n'); }
</script>
</body></html>
