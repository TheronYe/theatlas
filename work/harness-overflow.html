<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
const f = document.createElement('iframe');
f.style.cssText = 'width:390px;height:844px;border:0';
f.src = '../the-atlas.html';
f.onload = () => setTimeout(() => {
  const d = f.contentDocument;
  const cw = d.documentElement.clientWidth;
  const bad = [];
  d.querySelectorAll('*').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width > cw + 1 || r.right > cw + 1) {
      bad.push(el.tagName + '.' + (el.className && el.className.split ? el.className.split(' ')[0] : '') + ' w=' + Math.round(r.width) + ' right=' + Math.round(r.right));
    }
  });
  const sw = Math.max(d.documentElement.scrollWidth, d.body.scrollWidth);
  document.getElementById('out').textContent =
    'cw=' + cw + ' sw=' + sw + '\n' + bad.slice(0, 25).join('\n');
}, 3000);
document.body.appendChild(f);
</script>
</body></html>
