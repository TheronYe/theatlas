<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
window.__fails = [];
window.addEventListener('error', e => { try { __fails.push((e.target && (e.target.src||e.target.href)) || e.message); } catch(_){} }, true);
const f = document.createElement('iframe');
f.style.cssText = 'width:390px;height:844px;border:0';
f.src = '../assets/vr/tour/index.html';
f.onload = () => setTimeout(() => {
  try {
    const d = f.contentDocument;
    const r = {
      panoContainer: !!d.querySelector('#panoContainer'),
      panoChildren: d.querySelector('#panoContainer') ? d.querySelector('#panoContainer').children.length : -1,
      canvas: d.querySelectorAll('canvas').length,
      text: (d.body.innerText || '').replace(/\s+/g,' ').slice(0, 160),
      title: d.title,
      krpanoPresent: typeof f.contentWindow.krpano !== 'undefined',
      bodyHtmlLen: d.body.innerHTML.length
    };
    // 资源加载失败采样
    r.failedSample = __fails.slice(0, 6);
    r.failedCount = __fails.length;
    document.getElementById('out').textContent = JSON.stringify(r, null, 1);
  } catch (e) { document.getElementById('out').textContent = 'ERR ' + e.message; }
}, 12000);
document.body.appendChild(f);
</script>
</body></html>
