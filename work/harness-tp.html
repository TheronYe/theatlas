<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
const out = [];
let pending = 4;
const cases = [
  ['the-atlas', 1440, 900],
  ['the-atlas', 390, 844],
  ['location', 1440, 900],
  ['location', 390, 844]
];
cases.forEach((c, i) => {
  const f = document.createElement('iframe');
  f.style.cssText = 'width:' + c[1] + 'px;height:' + c[2] + 'px;border:0';
  f.src = '../' + c[0] + '.html';
  f.onload = () => setTimeout(() => {
    try {
      const d = f.contentDocument, w = f.contentWindow;
      const r = { p: c[0], vp: c[1] };
      const sw = Math.max(d.documentElement.scrollWidth, d.body.scrollWidth);
      r.hscroll = sw > d.documentElement.clientWidth + 1;
      r.imgs = d.images.length;
      r.broken = [...d.images].filter(x => x.complete && x.naturalWidth === 0).map(x => x.src.split('/').pop()).slice(0, 5);
      r.facilities = d.querySelectorAll('.facility').length;
      r.stats = d.querySelectorAll('.stat').length;
      r.statDone = [...d.querySelectorAll('.stat-num[data-done]')].length;
      r.statValues = [...d.querySelectorAll('.stat-num')].map(x => x.textContent).join(',');
      r.brands = d.querySelectorAll('.brand').length;
      r.photoCards = d.querySelectorAll('.photo-card').length;
      r.notesLi = d.querySelectorAll('.notes-list li').length;
      const det = d.querySelector('.notes');
      if (det) { det.open = true; }
      r.title = d.querySelector('.tp-title') ? d.querySelector('.tp-title').textContent.slice(0, 20) : '';
      r.kickers = [...d.querySelectorAll('.kicker')].length;
      out[i] = JSON.stringify(r);
    } catch (e) { out[i] = c[0] + ' ERR ' + e.message; }
    if (--pending === 0) document.getElementById('out').textContent = out.join('\n');
  }, 3000);
  document.body.appendChild(f);
});
</script>
</body></html>
