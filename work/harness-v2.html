<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
const cases = [
  { p: 'index', w: 390, h: 844 },
  { p: 'index', w: 1440, h: 900 },
  { p: 'location', w: 390, h: 844 },
  { p: 'sales-info', w: 1440, h: 900 }
];
const out = [];
let pending = cases.length;
cases.forEach((c, i) => {
  const f = document.createElement('iframe');
  f.style.cssText = `width:${c.w}px;height:${c.h}px;border:0`;
  f.src = `../${c.p}.html`;
  f.onload = () => setTimeout(() => {
    try {
      const d = f.contentDocument, w = f.contentWindow, cs = w.getComputedStyle;
      const gate = d.querySelector('.splash-gate');
      const gateVisible = gate && !gate.classList.contains('hidden');
      const gateParas = gate ? gate.querySelectorAll('.splash-gate__scroll p').length : -1;
      const gateScroll = gate ? gate.querySelector('.splash-gate__scroll') : null;
      const enterBtn = gate ? gate.querySelector('[data-gate-enter]') : null;
      const enterText = enterBtn ? enterBtn.textContent.trim() : 'n/a';
      // 字号
      const bodyFs = cs(d.body).fontSize;
      const h1 = d.querySelector('.page-hero h1');
      const h1Fs = h1 ? cs(h1).fontSize : (d.querySelector('.section h2') ? cs(d.querySelector('.section h2')).fontSize : 'n/a');
      const lead = d.querySelector('.lead');
      const leadFs = lead ? cs(lead).fontSize : 'n/a';
      // 页脚热线：只应有图标，不含号码
      const fcIcon = d.querySelector('.fc-icon');
      const fcValue = d.querySelector('.fc-value');
      const footerText = d.querySelector('.site-footer') ? d.querySelector('.site-footer').textContent : '';
      const hasNumber = /5339\s*2749/.test(footerText);
      // 溢出
      const sw = Math.max(d.documentElement.scrollWidth, d.body.scrollWidth);
      const cw = d.documentElement.clientWidth;
      out[i] = `${c.p}@${c.w}: gate=${gateVisible} paras=${gateParas} enter="${enterText}" bodyFs=${bodyFs} h1Fs=${h1Fs} leadFs=${leadFs} fcIcon=${!!fcIcon} fcValue=${!!fcValue} numberInFooter=${hasNumber} hscroll=${sw > cw + 1}(sw=${sw},cw=${cw})`;
    } catch (e) { out[i] = `${c.p}@${c.w}: ERROR ${e.message}`; }
    if (--pending === 0) document.getElementById('out').textContent = out.join('\n');
  }, 900);
  document.body.appendChild(f);
});
</script>
</body></html>
