<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<pre id="out">RUNNING</pre>
<script>
const out = [];
let pending = 2;

/* 1) VR WebGL 渲染检查 */
const f1 = document.createElement('iframe');
f1.style.cssText = 'width:390px;height:844px;border:0';
f1.src = '../vr.html';
f1.onload = () => setTimeout(() => {
  try {
    const d = f1.contentDocument;
    const c = d.querySelector('#vr-canvas');
    const r = { exists: !!c };
    if (c) {
      r.cssSize = c.clientWidth + 'x' + c.clientHeight;
      r.bufferSize = c.width + 'x' + c.height;
      const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
      r.webgl = !!gl;
      if (gl) {
        const px = new Uint8Array(4);
        gl.readPixels(Math.floor(c.width/2), Math.floor(c.height/2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        r.centerPixel = Array.from(px).join(',');
        r.rendered = !(px[0]===0 && px[1]===0 && px[2]===0 && px[3]===0);
      }
    }
    out[0] = 'VR: ' + JSON.stringify(r);
  } catch (e) { out[0] = 'VR ERROR: ' + e.message; }
  if (--pending === 0) finish();
}, 2500);
document.body.appendChild(f1);

/* 2) 动画循环：滚入加 in、滚出移除 */
const f2 = document.createElement('iframe');
f2.style.cssText = 'width:390px;height:844px;border:0;position:absolute;left:450px;top:0';
f2.src = '../index.html';
f2.onload = () => setTimeout(() => {
  try {
    const d = f2.contentDocument, w = f2.contentWindow;
    // 跳过 gate
    const gate = d.querySelector('.splash-gate');
    if (gate && !gate.classList.contains('hidden')) {
      gate.querySelector('[data-gate-enter]').click();
    }
    setTimeout(() => {
      const card = d.querySelector('.card');
      const r = { cardFound: !!card };
      // 强制把卡片滚入视口
      card.scrollIntoView({ block: 'center' });
      setTimeout(() => {
        r.inWhenVisible = card.classList.contains('in');
        // 滚出视口
        w.scrollTo(0, 0);
        setTimeout(() => {
          r.inWhenHidden = card.classList.contains('in');
          r.loopOK = r.inWhenVisible === true && r.inWhenHidden === false;
          out[1] = 'ANIM-LOOP: ' + JSON.stringify(r);
          if (--pending === 0) finish();
        }, 800);
      }, 900);
    }, 600);
  } catch (e) { out[1] = 'ANIM ERROR: ' + e.message; if (--pending === 0) finish(); }
}, 1500);
document.body.appendChild(f2);

function finish() { document.getElementById('out').textContent = out.join('\n'); }
</script>
</body></html>
