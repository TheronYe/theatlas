<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>html,body{margin:0;padding:0;overflow:hidden}iframe{display:block;border:0}</style></head>
<body>
<script>
// 预览用：先写入 sessionStorage 跳过 splash gate，再以指定尺寸嵌入目标页面
const q = new URLSearchParams(location.search);
const page = q.get('p') || 'index';
const w = parseInt(q.get('w') || '390', 10);
const h = parseInt(q.get('h') || '844', 10);
try { sessionStorage.setItem('atlas-legal-accepted', '1'); } catch (e) {}
const f = document.createElement('iframe');
f.width = w; f.height = h;
f.src = '../' + page + '.html';
document.body.appendChild(f);
</script>
</body></html>
